version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch updates to keep PR noise low.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # ESLint 10 is incompatible with eslint-config-next (its bundled
      # eslint-plugin-react calls context.getFilename(), removed in v10).
      # Re-enable once eslint-config-next supports ESLint 10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
