name: Prune deployments

# Cleanup of old Vercel deployments — keeps the latest few production and
# preview deployments, deletes the rest. Runs on every merge to main (each merge
# creates a new deployment, so prune right after), plus a weekly safety net and
# manual dispatch. See ADR 0013. Skips cleanly until the VERCEL_* secrets are set.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: "How many recent previews to keep"
        default: "5"
      keep_production:
        description: "How many recent production deployments to keep"
        default: "3"
      dry_run:
        description: "Preview only — list what would be deleted, delete nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prune-deployments
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prune preview deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          PRUNE_KEEP: ${{ github.event.inputs.keep || '5' }}
          PRUNE_KEEP_PRODUCTION: ${{ github.event.inputs.keep_production || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN / VERCEL_PROJECT_ID not set — skipping."
            exit 0
          fi
          node scripts/prune-deployments.mjs
