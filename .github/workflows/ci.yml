name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  db-schema:
    name: DB schema in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `generate` is offline (no DATABASE_URL needed). If the schema changed
      # without a committed migration, it writes one here and the check fails.
      - name: Generate migrations from schema
        run: npm run db:generate
      - name: Require a committed migration for schema changes
        run: |
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::Schema changed but no migration was committed. Run 'npm run db:generate' and commit the result (see agent-kit/database.md)."
            git --no-pager status --porcelain db/migrations
            git --no-pager diff -- db/migrations
            exit 1
          fi
          echo "Schema and migrations are in sync."

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a changeset for code changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$changed"
          # Code paths that require a changelog entry. Extend as the app grows.
          code=$(echo "$changed" | grep -E '^(app|src|lib|components|scripts)/' || true)
          newchangeset=$(echo "$changed" | grep -E '^\.changeset/.+\.md$' | grep -v '^\.changeset/README\.md$' || true)
          if [ -n "$code" ] && [ -z "$newchangeset" ]; then
            echo "::error::Code changed but no changeset was added under .changeset/. See agent-kit/commit-and-pr.md."
            exit 1
          fi
          echo "Changeset check passed."
